<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transition & Transform Tutorial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.section{
    margin-bottom:50px;
}

h2{
    margin-bottom:15px;
}

.box{
    width:150px;
    height:150px;
    background:royalblue;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:20px 0;
    cursor:pointer;
}

/*==================================================
Transition
===================================================*/

/*
transition-property = কোন property animation হবে

transition-duration = কত সময় লাগবে

transition-delay = কত সময় পরে শুরু হবে

transition-timing-function =
ease
linear
ease-in
ease-out
ease-in-out
*/

.transition-box{

    transition-property:width,height;

    transition-duration:2s;

    transition-delay:1s;

    transition-timing-function:ease-in-out;

}

.transition-box:hover{

    width:300px;

    height:220px;

}


/*=========================================
Shortcut
==========================================*/

.shortcut{

    transition:all 2s ease-in-out;

}

.shortcut:hover{

    width:250px;

    background:green;

}


/*=========================================
Translate
==========================================*/

.translate{

    transition:2s;

}

.translate:hover{

    transform:translate(100px,40px);

}


/*=========================================
Translate X
==========================================*/

.translateX{

    transition:2s;

}

.translateX:hover{

    transform:translateX(120px);

}


/*=========================================
Translate Y
==========================================*/

.translateY{

    transition:2s;

}

.translateY:hover{

    transform:translateY(80px);

}


/*=========================================
Rotate
==========================================*/

.rotate{

    transition:2s;

}

.rotate:hover{

    transform:rotate(360deg);

}


/*
Turn Example

0.5turn = 180deg

1turn = 360deg
*/


/*=========================================
Scale
==========================================*/

.scale{

    transition:2s;

}

.scale:hover{

    transform:scale(1.8);

}


/*
scale(2)
Double Size

scale(0.5)

Half Size
*/


/*=========================================
Skew X
==========================================*/

.skewX{

    transition:2s;

}

.skewX:hover{

    transform:skewX(30deg);

}


/*=========================================
Skew Y
==========================================*/

.skewY{

    transition:2s;

}

.skewY:hover{

    transform:skewY(30deg);

}


/*=========================================
Multiple Transform
==========================================*/

.multiple{

    transition:2s;

}

.multiple:hover{

    transform:
    translateX(80px)
    rotate(45deg)
    scale(1.5);

}

</style>

</head>

<body>

<h1>CSS Transition & Transform Lesson</h1>

<div class="section">

<h2>1. Transition</h2>

<div class="box transition-box">

Hover Me

</div>

</div>


<div class="section">

<h2>2. Transition Shortcut</h2>

<div class="box shortcut">

Hover Me

</div>

</div>


<div class="section">

<h2>3. Translate (Move X,Y)</h2>

<div class="box translate">

Translate

</div>

</div>


<div class="section">

<h2>4. Translate X</h2>

<div class="box translateX">

TranslateX

</div>

</div>


<div class="section">

<h2>5. Translate Y</h2>

<div class="box translateY">

TranslateY

</div>

</div>


<div class="section">

<h2>6. Rotate</h2>

<div class="box rotate">

Rotate

</div>

</div>


<div class="section">

<h2>7. Scale</h2>

<div class="box scale">

Scale

</div>

</div>


<div class="section">

<h2>8. Skew X</h2>

<div class="box skewX">

SkewX

</div>

</div>


<div class="section">

<h2>9. Skew Y</h2>

<div class="box skewY">

SkewY

</div>

</div>


<div class="section">

<h2>10. Multiple Transform</h2>

<div class="box multiple">

All Together

</div>

</div>

</body>
</html>
